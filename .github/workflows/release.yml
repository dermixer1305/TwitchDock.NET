name: Release
# A tag creates a GitHub release only. NuGet publication is a separate maintainer action.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check version and bilingual release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/TwitchDock.Core/TwitchDock.Core.csproj -getProperty:Version -p:TargetFramework=net10.0)"
          if [ "v${version}" != "$RELEASE_TAG" ]; then echo "Tag does not match package version $version"; exit 1; fi
          test -s "docs/release-notes/${version}.md"
      - run: dotnet pack TwitchDock.slnx -c Release -o artifacts/packages
      - name: Generate package checksums
        working-directory: artifacts/packages
        run: sha256sum *.nupkg > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=()
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease --latest=false) ;; esac
          gh release create "$RELEASE_TAG" artifacts/packages/*.nupkg artifacts/packages/SHA256SUMS.txt \
            --verify-tag --title "TwitchDock.NET ${RELEASE_TAG#v}" \
            --notes-file "docs/release-notes/${RELEASE_TAG#v}.md" "${flags[@]}"
