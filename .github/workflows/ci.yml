name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore TwitchSdk.slnx
      - run: dotnet build TwitchSdk.slnx -c Release --no-restore
      - run: dotnet test tests/TwitchSdk.Tests/TwitchSdk.Tests.csproj -c Release -f ${{ matrix.framework }} --no-build --logger trx
      - name: Validate coverage evidence
        shell: pwsh
        run: ./tools/Test-ApiCoverage.ps1
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet pack TwitchSdk.slnx -c Release -o artifacts/packages
      - run: dotnet restore tests/TwitchSdk.PackageSmoke/TwitchSdk.PackageSmoke.csproj --source artifacts/packages --source https://api.nuget.org/v3/index.json
      - run: dotnet run --project tests/TwitchSdk.PackageSmoke/TwitchSdk.PackageSmoke.csproj -c Release -f net8.0 --no-restore
      - run: dotnet run --project tests/TwitchSdk.PackageSmoke/TwitchSdk.PackageSmoke.csproj -c Release -f net10.0 --no-restore
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
